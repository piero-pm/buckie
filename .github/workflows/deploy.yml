name: Deploy

# Deploys main to the VPS after CI passes. Triggered only on push to main
# (not PRs). Required GitHub secrets — see DEPLOY.md:
#   VPS_HOST      e.g. 203.0.113.10 (droplet public IP)
#   VPS_USER      usually 'buckie' (created by setup-vps.sh)
#   VPS_SSH_KEY   private key matching the pubkey authorized on the VPS
#   VPS_PATH      install dir, usually /opt/buckie
#   DEPLOY_DOMAIN e.g. buckie.yourname.com (written into the Caddyfile)
# Runtime app secrets (written to /opt/buckie/buckie.env on first
# provision, NOT rotated each deploy):
#   SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "deploy now" from the Actions tab

permissions:
  contents: read

jobs:
  ci:
    # Reusable-workflow call: GitHub can't `needs` a job defined in another
    # file, so deploy.yml runs ci.yml's gates itself on the same commit.
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if VPS secrets are missing
        env:
          CHECK: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$CHECK" ]; then
            echo "::warning::VPS_HOST secret is not set — skipping deploy. See DEPLOY.md to configure secrets once the VPS is provisioned."
            exit 0
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Cross-compile Go binary (linux/amd64)
        working-directory: backend
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../buckie-bin .

      - name: Stage artifacts
        run: |
          mkdir -p stage/dist
          cp buckie-bin stage/
          cp -r frontend/dist/* stage/dist/
          cp deploy/Caddyfile stage/ 2>/dev/null || true
          cp deploy/post-deploy.sh stage/ 2>/dev/null || true

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'stage/*'
          target: ${{ secrets.VPS_PATH }}/incoming

      - name: Activate (swap artifacts + restart service)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: ${{ secrets.VPS_PATH }}/incoming/post-deploy.sh ${{ secrets.VPS_PATH }} ${{ secrets.DEPLOY_DOMAIN }}

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: systemctl is-active --quiet buckie && echo OK || (echo FAIL; exit 1)
