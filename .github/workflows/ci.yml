name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: # let deploy.yml run these gates on the same commit before shipping
  workflow_dispatch:

jobs:
  # Single gate job (build/vet/test/lint/format, backend + frontend). Runs on
  # PRs standalone; on pushes to main it runs as a reusable workflow inside
  # deploy.yml, so deploys only ship after it passes.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Backend - build
        working-directory: backend
        run: go build ./...
      - name: Backend - vet
        working-directory: backend
        run: go vet ./...
      - name: Backend - format
        working-directory: backend
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Formatting issues: $out"; exit 1; fi
      - name: Backend - test
        working-directory: backend
        run: go test ./...

      - name: Frontend - install
        working-directory: frontend
        run: npm ci
      - name: Frontend - format check
        working-directory: frontend
        run: npx prettier --check .
      - name: Frontend - lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend - test
        working-directory: frontend
        run: npm test
      - name: Frontend - build
        working-directory: frontend
        run: npm run build
