name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Single gate job so deploy.yml can depend on it by name. Runs all backend +
  # frontend checks; any failure blocks both merge (branch protection) and deploy.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Backend - build
        working-directory: backend
        run: go build ./...
      - name: Backend - vet
        working-directory: backend
        run: go vet ./...
      - name: Backend - format
        working-directory: backend
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Formatting issues: $out"; exit 1; fi
      - name: Backend - test
        working-directory: backend
        run: go test ./...

      - name: Frontend - install
        working-directory: frontend
        run: npm ci
      - name: Frontend - format check
        working-directory: frontend
        run: npx prettier --check .
      - name: Frontend - lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend - test
        working-directory: frontend
        run: npm test
      - name: Frontend - build
        working-directory: frontend
        run: npm run build
